name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        run: pytest -q
      - name: CLI surface
        run: python -m aaa_v0.cli --help
      - name: Provider-scope guard
        run: '! grep -R -E "OpenAI|Anthropic|Gemini" -n src/aaa_v0 tests'
